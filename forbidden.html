<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access denied — OIA Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(circle at top, var(--navy), var(--deep-navy)); padding: 24px; }
    .card { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 36px; text-align: center; }
    .card h1 { font-size: 22px; color: var(--navy); margin-bottom: 8px; }
    .card p { font-size: 13.5px; color: var(--muted); margin-bottom: 22px; }
    .card a { display: inline-block; margin: 0 6px; padding: 10px 18px; border-radius: 10px; font-size: 13.5px;
              font-weight: 600; text-decoration: none; background: var(--navy); color: #fff; }
    .card a.secondary { background: var(--blue-soft); color: var(--navy); }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='oia-icons.css') }}?v=2">
</head>
<body>
  <div class="card">
    <h1>Access denied</h1>
    <p>{{ message }}{% if current_user %} You're signed in as <strong>{{ current_user.username }}</strong>.{% endif %}</p>
    <a href="{{ url_for('index') }}">Back to Hub</a>
    <a class="secondary" href="{{ url_for('logout') }}">Sign in as someone else</a>
  </div>
  <script src="{{ url_for('static', filename='oia-icons.js') }}?v=2"></script>
</body>
</html>
